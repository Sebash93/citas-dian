name: Keep monitor enabled

# GitHub disables scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: "17 13 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable"
