name: Booker test run

# Runs the booker by hand to check the live link, the wizard and timings. Dry run by default:
# it never clicks Agendar. Only tramites whose name contains the city are ever chosen, and a
# real (non-dry) run is refused outside Bogotá, Bucaramanga, Cali and Medellín.
# The person and the city come from an Airtable case (e.g. case-3).
on:
  workflow_dispatch:
    inputs:
      tipo_atencion:
        description: "1 = Presencial, 2 = Videoatención (real bookings: only 2)"
        default: "2"
      categoria:
        description: "13 = Devoluciones, 7 = RUT (see config.py)"
        default: "13"
      case:
        description: "Airtable case id, e.g. case-3 (sets the person and the city)"
        required: true
      service:
        description: "Optional: which of the city's tramites (e.g. vehiculos)"
        default: ""
      dry_run:
        description: "Stop before Agendar"
        type: boolean
        default: true

concurrency:
  group: dian-booker-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BOOKER_READY_FILE: /tmp/booker-ready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-booker.txt
      - run: .github/scripts/booker-setup.sh
      - name: Book
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIAN_TIPO_ATENCION: ${{ inputs.tipo_atencion }}
          DIAN_CATEGORIA: ${{ inputs.categoria }}
          DIAN_BOOKING_FILE: /tmp/booking-test.json
          BOOKER_CASE: ${{ inputs.case }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE: ${{ vars.AIRTABLE_TABLE }}
          DIAN_SERVICE: ${{ inputs.service || 'vehiculos' }}
          BOOKER_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          BOOKER_WAIT_MINUTES: "3"
          DIAN_EVENTS_FILE: events/booker-test.jsonl
        run: python -m dian_booker --trigger found
      - name: Upload event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booker-test-events-${{ github.run_id }}
          path: events/booker-test.jsonl
          if-no-files-found: ignore
          retention-days: 30
