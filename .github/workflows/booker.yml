name: Booker
# The monitor matches runs to cases by this title ("Booker <case> <trigger>").
run-name: Booker ${{ inputs.case }} ${{ inputs.trigger }}

# Started by the monitor on Render (GitHub API, workflow_dispatch), one run per case, when the
# case's city opens or, to watch it for a few minutes, when another tramite opens. Drives the
# wizard to the reCAPTCHA and sends the live-browser link; a human solves the captcha.
# After a real booking it uploads an empty `booking-booked-<case>` artifact (`booking-booked`
# for the default case), which stops the monitor from starting more bookers for that case.
# The cases come from cases.json in the repo; the default case uses the BOOKER_* secrets. To test by hand use booker-test.yml instead.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "found: send the link at once; watch: only when the case's city appears"
        type: choice
        options: [found, watch]
        default: found
      case:
        description: "Case id from cases.json (default: the BOOKER_* person, Medellín)"
        default: default

# One run at a time per case; different cases run in parallel.
concurrency:
  group: dian-booker-${{ inputs.case }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    # Up to 12 min waiting for Medellín, 10 for the captcha, 10 holding the browser open.
    timeout-minutes: 45
    env:
      BOOKER_READY_FILE: /tmp/booker-ready
      DIAN_BOOKING_FILE: booked/booking.json
      DIAN_EVENTS_FILE: events/booker.jsonl
    steps:
      - uses: actions/checkout@v4

      # Background install while Python and Playwright install; the booker waits for it.
      - name: Prepare live browser (background)
        run: nohup .github/scripts/booker-setup.sh > /tmp/booker-setup.log 2>&1 &

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-booker.txt

      - name: Book
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOKER_DRY_RUN: ${{ vars.BOOKER_DRY_RUN }}
          # Optional: which tramite to prefer when several are open (e.g. vehiculos); a case's
          # own `service` wins.
          BOOKER_SERVICE: ${{ vars.BOOKER_SERVICE }}
          # Passed through env, never interpolated into the script; validated by the booker.
          BOOKER_CASE: ${{ inputs.case }}
          DIAN_CASES_FILE: cases.json
          BOOKER_DOC_TYPE: ${{ secrets.BOOKER_DOC_TYPE }}
          BOOKER_DOC_NUMBER: ${{ secrets.BOOKER_DOC_NUMBER }}
          BOOKER_FULL_NAME: ${{ secrets.BOOKER_FULL_NAME }}
          BOOKER_EMAIL: ${{ secrets.BOOKER_EMAIL }}
          BOOKER_PHONE: ${{ secrets.BOOKER_PHONE }}
        run: python -m dian_booker --trigger "${{ inputs.trigger }}"

      # The marker carries no personal data: booking*.json (date, sede) is replaced by a
      # timestamp. The booker writes booked/booking.json (default case) or booking-<case>.json.
      - name: Mark booked
        if: always()
        run: |
          if ls booked/booking*.json > /dev/null 2>&1; then
            mkdir -p marker && date -u +%FT%TZ > marker/booked.txt
          fi

      - name: Upload booked marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.case == 'default' && 'booking-booked' || format('booking-booked-{0}', inputs.case) }}
          path: marker/booked.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booker-events-${{ github.run_id }}
          path: events/booker.jsonl
          if-no-files-found: ignore
          retention-days: 30
