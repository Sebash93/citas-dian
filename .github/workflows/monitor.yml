name: Monitor citas DIAN

on:
  schedule:
    # Every 5 min, off the :00 minute (GitHub's most delayed slot). Each run polls for
    # ~19 min, so the concurrency queue keeps coverage continuous despite cron delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Single check now (ignores cadence and pauses)"
        type: boolean
        default: true

concurrency:
  group: dian-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dian-state-${{ github.run_id }}
          restore-keys: dian-state-

      - name: Check DIAN
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m dian_monitor ${{ inputs.once && '--once' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: dian-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ github.run_id }}
          path: captures/
          if-no-files-found: ignore
          retention-days: 30
