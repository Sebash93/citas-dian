name: Monitor citas DIAN

# Fallback for the always-on monitor on Render (render.yaml). GitHub's cron is best effort
# and often starts only a few runs a day. Turn the schedule off once Render is live with
#   gh variable set DIAN_GITHUB_MONITOR --body 0
# and back on with --body 1. Manual runs always work.
on:
  schedule:
    # Every 5 min, off the :00 minute (GitHub's most delayed slot). Each run polls for
    # ~19 min, so the concurrency queue keeps coverage continuous despite cron delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Single check now (ignores cadence and pauses)"
        type: boolean
        default: true

concurrency:
  group: dian-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.DIAN_GITHUB_MONITOR != '0'
    runs-on: ubuntu-latest
    # ~19 min of polling, plus up to ~35 min if a booker is mid-attempt when the budget ends.
    timeout-minutes: 60
    env:
      BOOKER_READY_FILE: /tmp/booker-ready
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r ${{ vars.DIAN_BOOKER == '1' && 'requirements-booker.txt' || 'requirements.txt' }}

      # Background install so polling starts at once; the booker waits for $BOOKER_READY_FILE.
      - name: Prepare live browser (background)
        if: vars.DIAN_BOOKER == '1'
        run: nohup .github/scripts/booker-setup.sh > /tmp/booker-setup.log 2>&1 &

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dian-state-${{ github.run_id }}
          restore-keys: dian-state-

      - name: Check DIAN
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIAN_BOOKER: ${{ vars.DIAN_BOOKER }}
          BOOKER_DRY_RUN: ${{ vars.BOOKER_DRY_RUN }}
          BOOKER_DOC_TYPE: ${{ secrets.BOOKER_DOC_TYPE }}
          BOOKER_DOC_NUMBER: ${{ secrets.BOOKER_DOC_NUMBER }}
          BOOKER_FULL_NAME: ${{ secrets.BOOKER_FULL_NAME }}
          BOOKER_EMAIL: ${{ secrets.BOOKER_EMAIL }}
          BOOKER_PHONE: ${{ secrets.BOOKER_PHONE }}
        run: python -m dian_monitor ${{ inputs.once && '--once' || '' }}

      # Same marker as booker.yml, so the Render monitor also learns about this booking.
      - name: Mark booked
        if: always()
        run: |
          if [ -f state/booking.json ]; then
            mkdir -p marker && date -u +%FT%TZ > marker/booked.txt
          fi

      - name: Upload booked marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-booked
          path: marker/booked.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: dian-state-${{ github.run_id }}-${{ github.run_attempt }}

      # The whole rolling log (months), so only the newest artifact is ever needed.
      # No personal data in it: see src/dian_monitor/events.py.
      - name: Upload event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-${{ github.run_id }}
          path: state/events.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ github.run_id }}
          path: captures/
          if-no-files-found: ignore
          retention-days: 30
